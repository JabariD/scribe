name: Release
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run tauri build
      - name: Zip app
        run: cd src-tauri/target/release/bundle/macos && zip -r Scribe-macos.zip Scribe.app
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/macos/Scribe-macos.zip
