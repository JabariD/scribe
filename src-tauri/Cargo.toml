[package]
name = "scribe"
version = "0.3.1"
description = "Voice-to-text transcription app"
authors = ["Payton Dennis"]
license = "MIT"
repository = "https://github.com/paytondennis/scribe"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["clipboard-write-text", "global-shortcut-all", "notification-all", "system-tray", "shell-open", "icon-png", "window-center", "window-hide", "window-set-always-on-top", "window-set-focus", "window-set-position", "window-set-size", "window-show"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
security-framework = "2.11"
cpal = "0.15"
hound = "3.5"
dirs = "5.0"
chrono = "0.4"
parking_lot = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
